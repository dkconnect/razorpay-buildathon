<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#FFFFFF"/>
  <!-- Baseline Left -->
  <line x1="80" y1="280" x2="220" y2="280" stroke="#000000" stroke-width="32" stroke-linecap="round"/>
  <!-- The Regime Step (Breakpoint) -->
  <line x1="220" y1="280" x2="292" y2="180" stroke="#00F0FF" stroke-width="32" stroke-linecap="round"/>
  <!-- Shifted Regime Right -->
  <line x1="292" y1="180" x2="432" y2="180" stroke="#000000" stroke-width="32" stroke-linecap="round"/>
  <!-- Focus Changepoint Dot -->
  <circle cx="220" cy="280" r="12" fill="#00F0FF"/>
</svg>
